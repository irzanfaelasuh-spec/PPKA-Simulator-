<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060b14">
  <meta name="description" content="PPKA Indonesia — simulasi edukasi pengaturan perjalanan kereta api oleh RailwayOp.">

  <title>PPKA Indonesia — RailwayOp</title>

  <!-- CSS: file berada di root repository -->
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <div id="app">
    <header id="top">
      <div class="brand">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path
            d="M3 19h18M6 19l2.5-13h7L18 19M9.5 12h5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
          />
        </svg>

        <div>
          <b>PPKA INDONESIA</b>
          <small>RailwayOp · simulasi edukasi</small>
        </div>
      </div>

      <div id="clk"></div>
      <div id="stat"></div>
      <div id="ctl"></div>
    </header>

    <main>
      <div id="map">
        <canvas id="cv"></canvas>

        <div id="mb">
          <button data-a="zi" aria-label="Zoom in">+</button>
          <button data-a="zo" aria-label="Zoom out">−</button>
          <button data-a="fit" aria-label="Fit">⤢</button>
          <button data-a="fol" id="fol" aria-label="Ikuti">◎</button>
        </div>

        <div id="toast"></div>

        <div id="lgd">
          <i class="g"></i>Hijau
          <i class="y"></i>Kuning
          <i class="r"></i>Merah ·
          <i class="c"></i>Dipesan
          <i class="a"></i>Terisi
        </div>
      </div>

      <aside id="pn">
        <nav id="tabs"></nav>
        <section id="pv"></section>
      </aside>
    </main>
  </div>

  <!-- JavaScript: semua file berada di root repository -->
  <script src="./data.js"></script>
  <script src="./engine.js"></script>
  <script src="./ui.js"></script>
</body>
</html>
